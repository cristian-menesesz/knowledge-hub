name: Fast Feedback - Quick Checks

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: Quick Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run quick checks
        run: |
          echo "🔍 Running format check..."
          npm run format:check
          echo "✅ Format check passed"
          
          echo "🔍 Running linter..."
          npm run lint
          echo "✅ Linter passed"

  type-and-test:
    name: TypeCheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quick-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: type-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Check build outputs
        run: |
          echo "✅ Build completed successfully"
          ls -la packages/*/dist || echo "No dist folders found yet"
